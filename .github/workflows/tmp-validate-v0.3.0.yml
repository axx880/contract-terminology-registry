name: tmp validate registry v0.3.0
on:
  push:
    branches: [feature/object-reference-tmc-v0.3.0]
  workflow_dispatch:

permissions:
  contents: write

# Temporary release-gate workflow. It reconstructs the intended XLSX from
# staged Base64 chunks, validates canonical payloads and workbook contents,
# then commits the validated binary back to the feature branch.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild staged Excel export
        shell: bash
        run: |
          cat .tmp/v03_00.b64 .tmp/v03_01.b64 .tmp/v03_0203.b64 | base64 --decode > exports/Contract_Terminology_Dictionary_v0.3.0.xlsx
      - name: Validate canonical payloads and Excel export
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, zipfile
          import xml.etree.ElementTree as ET

          version='0.3.0'
          paths=['data/terms.json','data/naming-rules.json','data/history.json','data/sources.json']
          docs=[json.load(open(p,encoding='utf-8')) for p in paths]
          assert all(d['registryVersion']==version for d in docs)
          terms,rules,history,sources=docs[0]['terms'],docs[1]['rules'],docs[2]['history'],docs[3]['sources']
          assert len({x['termId'] for x in terms})==len(terms)
          assert len({x['machineName'] for x in terms})==len(terms)
          assert len({x['ruleId'] for x in rules})==len(rules)
          assert len({x['historyId'] for x in history})==len(history)
          assert len({x['sourceId'] for x in sources})==len(sources)
          byname={x['machineName']:x for x in terms}
          assert 'OBJECT_REFERENCE' in byname['Article']['scope']
          assert 'OBJECT_REFERENCE' in byname['Unit']['scope']
          assert 'OBJECT_REFERENCE' in byname['Manufacturer']['scope']

          p='exports/Contract_Terminology_Dictionary_v0.3.0.xlsx'
          raw=open(p,'rb').read()
          print('XLSX_SIZE',len(raw))
          print('XLSX_SHA256',hashlib.sha256(raw).hexdigest())
          with zipfile.ZipFile(p) as z:
            assert z.testzip() is None
            for n in z.namelist():
              if n.endswith('.xml') or n.endswith('.rels'):
                ET.fromstring(z.read(n))
            ns={'m':'http://schemas.openxmlformats.org/spreadsheetml/2006/main','r':'http://schemas.openxmlformats.org/officeDocument/2006/relationships'}
            shared=[]
            if 'xl/sharedStrings.xml' in z.namelist():
              root=ET.fromstring(z.read('xl/sharedStrings.xml'))
              for si in root.findall('m:si',ns): shared.append(''.join(t.text or '' for t in si.findall('.//m:t',ns)))
            wb=ET.fromstring(z.read('xl/workbook.xml'))
            rel=ET.fromstring(z.read('xl/_rels/workbook.xml.rels'))
            rm={x.attrib['Id']:x.attrib['Target'] for x in rel}
            sm={}
            for s in wb.find('m:sheets',ns):
              rid=s.attrib['{http://schemas.openxmlformats.org/officeDocument/2006/relationships}id']
              t=rm[rid]
              sm[s.attrib['name']]=t.lstrip('/') if t.startswith('/') else 'xl/'+t
            def cells(sheet):
              root=ET.fromstring(z.read(sm[sheet])); out={}
              for c in root.findall('.//m:sheetData/m:row/m:c',ns):
                ref=c.attrib['r']; typ=c.attrib.get('t')
                if typ=='s':
                  v=c.find('m:v',ns); val=shared[int(v.text)] if v is not None and v.text is not None else ''
                elif typ=='inlineStr': val=''.join(t.text or '' for t in c.findall('.//m:t',ns))
                else:
                  v=c.find('m:v',ns); val=v.text if v is not None and v.text is not None else ''
                out[ref]=val
              return out
            def col(c):
              s=''
              while c:
                c,r=divmod(c-1,26); s=chr(65+r)+s
              return s
            expected={
              'Terms':(['TermID','MachineName','DisplayNameRu','DefinitionRu','Scope','ScopeNoteRu','Status','IntroducedIn','NotesRu','SourceRefs'],[[x['termId'],x['machineName'],x['displayNameRu'],x['definitionRu'],'; '.join(x['scope']),x['scopeNoteRu'],x['status'],x['introducedIn'],x.get('notesRu') or '', '; '.join(x['sourceRefs'])] for x in terms]),
              'Naming Rules':(['RuleID','Category','Pattern','DescriptionRu','AppliesTo','Examples','Status'],[[x['ruleId'],x['category'],x['pattern'],x['descriptionRu'],'; '.join(x['appliesTo']),'; '.join(x['examples']),x['status']] for x in rules]),
              'History':(['HistoryID','OldMachineName','Status','ReplacedBy','ReasonRu','ScopeNoteRu','EffectiveIn','SourceRefs'],[[x['historyId'],x['oldMachineName'],x['status'],x.get('replacedBy') or '',x['reasonRu'],x['scopeNoteRu'],x['effectiveIn'],'; '.join(x['sourceRefs'])] for x in history]),
              'Sources':(['SourceID','Context','EvidenceRu','URL'],[[x['sourceId'],x['context'],x['evidenceRu'],x['url']] for x in sources])}
            for sheet,(headers,rows) in expected.items():
              c=cells(sheet); allrows=[headers]+rows
              for rno,row in enumerate(allrows,3):
                for cno,val in enumerate(row,1):
                  got=c.get(f'{col(cno)}{rno}','')
                  if got != str(val):
                    raise AssertionError(f'{sheet} {col(cno)}{rno}: {got!r} != {val!r}')
            names=[]
            for n in z.namelist():
              if n.startswith('xl/tables/') and n.endswith('.xml'):
                root=ET.fromstring(z.read(n)); names.append(root.attrib['name'])
                cols=root.find('m:tableColumns',ns)
                assert cols is not None and int(cols.attrib['count'])==len(list(cols))
            assert len(names)==len(set(names))==4
          print('REGISTRY_EXPORT_VALIDATION PASS')
          PY
      - name: Commit validated Excel export
        shell: bash
        run: |
          if git diff --quiet -- exports/Contract_Terminology_Dictionary_v0.3.0.xlsx; then
            echo "Validated export already matches branch."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports/Contract_Terminology_Dictionary_v0.3.0.xlsx
          git commit -m "Fix validated registry v0.3.0 Excel export"
          git push
